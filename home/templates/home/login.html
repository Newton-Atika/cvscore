<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - AI CV Scorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { 
      background-color: #000; 
      color: #fff; 
      font-family: 'Segoe UI', Arial, sans-serif; 
      margin: 0; 
      padding: 0; 
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Navigation */
    nav {
      background: #111;
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-bottom: 2px solid limegreen;
      box-sizing: border-box;
    }
    nav .logo {
      color: limegreen;
      font-size: 1.5rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin: 0;
      padding: 0;
    }
    nav ul li a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }
    nav ul li a:hover {
      color: limegreen;
    }

    /* Login container */
    .auth-container { 
      background-color: #111; 
      border: 2px solid limegreen; 
      padding: 25px 20px; 
      border-radius: 12px; 
      width: 100%;
      max-width: 400px;
      margin: 40px 10px;
      box-shadow: 0 0 12px limegreen;
      box-sizing: border-box;
    }

    h2 {
      color: limegreen;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin: 10px 0 5px;
      font-size: 0.95rem;
    }

    input { 
      width: 100%; 
      padding: 12px; 
      margin: 5px 0 15px 0; 
      border-radius: 5px; 
      border: 1px solid limegreen; 
      background: #222; 
      color: #fff; 
      font-size: 1rem;
      box-sizing: border-box;
    }

    button { 
      padding: 12px; 
      background: limegreen; 
      border: none; 
      color: #000; 
      font-weight: bold; 
      border-radius: 6px; 
      cursor: pointer; 
      width: 100%;
      font-size: 1rem;
      transition: all 0.3s ease-in-out;
    }
    button:hover { 
      background: #fff; 
      color: limegreen; 
      border: 2px solid limegreen; 
    }

    a { color: limegreen; text-decoration: none; }
    a:hover { color: #fff; }

    .toggle-password { 
      font-size: 0.9em; 
      cursor: pointer; 
      color: limegreen; 
      margin-left: 5px;
      display: inline-block;
      margin-bottom: 15px;
    }

    @media (max-width: 480px) {
      nav {
        padding: 10px 15px;
      }
      nav .logo {
        font-size: 1.3rem;
        margin-bottom: 5px;
      }
      nav ul li a {
        font-size: 0.9rem;
      }
      .auth-container {
        padding: 20px 15px;
        margin: 30px 10px;
      }
      input, button {
        font-size: 0.95rem;
      }
      label {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="logo">AI CV Scorer</div>
    <ul>
      <li><a href="{% url 'home' %}">Home</a></li>
      <li><a href="{% url 'upload_document' %}">Upload CV</a></li>
      <li><a href="{% url 'signup' %}">Signup</a></li>
      <li><a href="{% url 'login' %}">Login</a></li>
    </ul>
  </nav>

  <!-- Login form -->
  <div class="auth-container">
    <h2>Login</h2>
    <form method="post">
      {% csrf_token %}
      
      <!-- Username/email -->
      <label for="id_username">Username or Email</label>
      {{ form.username }}

      <!-- Password -->
      <label for="id_password">Password</label>
      {{ form.password }}
      <span class="toggle-password" onclick="togglePassword('id_password')">Show/Hide</span>

      <!-- Hidden next field -->
      <input type="hidden" name="next" value="{{ next }}">

      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'signup' %}">Sign up here</a></p>
  </div>

  <script>
    function togglePassword(fieldId){
      const field = document.getElementById(fieldId);
      if (field) {
        field.type = field.type === 'password' ? 'text' : 'password';
      }
    }
  </script>
</body>
</html>
