<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - AI CV Scorer</title>
  <style>
    body { 
      background-color: #000; 
      color: #fff; 
      font-family: 'Segoe UI', Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 0; 
    }

    /* Navigation */
    nav {
      background: #111;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid limegreen;
    }
    nav .logo {
      color: limegreen;
      font-size: 1.5rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }
    nav ul li a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    nav ul li a:hover {
      color: limegreen;
    }

    /* Login container */
    .auth-container { 
      background-color: #111; 
      border: 2px solid limegreen; 
      padding: 30px; 
      border-radius: 12px; 
      display: inline-block; 
      width: 350px; 
      margin-top: 60px;
      box-shadow: 0 0 12px limegreen;
    }

    input { 
      width: 100%; 
      padding: 12px; 
      margin: 10px 0; 
      border-radius: 5px; 
      border: 1px solid limegreen; 
      background: #222; 
      color: #fff; 
    }

    button { 
      padding: 12px 25px; 
      background: limegreen; 
      border: none; 
      color: #000; 
      font-weight: bold; 
      border-radius: 6px; 
      cursor: pointer; 
      margin-top: 10px; 
      width: 100%;
      transition: all 0.3s ease-in-out;
    }
    button:hover { 
      background: #fff; 
      color: limegreen; 
      border: 2px solid limegreen; 
    }

    a { color: limegreen; text-decoration: none; }
    a:hover { color: #fff; }

    .toggle-password { 
      font-size: 0.9em; 
      cursor: pointer; 
      color: limegreen; 
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="logo">AI CV Scorer</div>
    <ul>
      <li><a href="{% url 'home' %}">Home</a></li>
      <li><a href="{% url 'upload_document' %}">Upload CV</a></li>
      <li><a href="{% url 'signup' %}">Signup</a></li>
      <li><a href="{% url 'login' %}">Login</a></li>
    </ul>
  </nav>

  <!-- Login form -->
  <div class="auth-container">
    <h2>Login</h2>
    <form method="post">
      {% csrf_token %}
      
      <!-- Username/email -->
      <label for="id_username">Username or Email</label>
      {{ form.username }}

      <!-- Password -->
      <label for="id_password">Password</label>
      {{ form.password }}
      <span class="toggle-password" onclick="togglePassword('id_password')">Show/Hide</span>

      <!-- Hidden next field -->
      <input type="hidden" name="next" value="{{ next }}">

      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'signup' %}">Sign up here</a></p>
  </div>

  <script>
    function togglePassword(fieldId){
      const field = document.getElementById(fieldId);
      if (field) {
        field.type = field.type === 'password' ? 'text' : 'password';
      }
    }
  </script>
</body>
</html>
