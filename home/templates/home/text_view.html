<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extracted CV & Job Description</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { 
      background-color: #000; 
      color: #fff; 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      text-align: center;
      margin: 0;
      box-sizing: border-box;
    }

    h1 { 
      color: limegreen; 
      margin-bottom: 20px;
      font-size: 2rem;
    }

    h2 { 
      color: #fff; 
      border-bottom: 2px solid limegreen; 
      padding-bottom: 5px; 
      margin-top: 30px;
      font-size: 1.5rem;
    }

    .text-area {
      white-space: pre-wrap; 
      word-wrap: break-word;
      border: 2px solid limegreen; 
      padding: 15px;
      border-radius: 10px; 
      background-color: #111;
      color: #fff;
      max-height: 250px;
      overflow-y: auto;
      text-align: left;
      margin: 10px auto 30px auto;
      width: 80%;
      box-sizing: border-box;
    }

    .button {
      display: inline-block;
      padding: 12px 25px;
      margin-top: 20px;
      background-color: limegreen;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 5px;
      transition: all 0.3s ease;
      width: 80%;
      max-width: 300px;
      box-sizing: border-box;
    }

    .button:hover { 
      background-color: #fff; 
      color: limegreen; 
    }

    .button.disabled {
      background-color: #555;
      color: #999;
      cursor: not-allowed;
      pointer-events: none;
    }

    a.upload-link {
      color: limegreen; 
      text-decoration: none;
      margin-top: 20px;
      display: inline-block;
    }

    a.upload-link:hover {
      color: #fff;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      h2 { font-size: 1.2rem; }
      .text-area { width: 95%; padding: 10px; max-height: 200px; }
      .button { width: 95%; padding: 10px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <h1>Uploaded Data</h1>

  <h2>Extracted CV Text</h2>
  <div class="text-area">{{ extracted_text }}</div>

  <h2>Job Description</h2>
  <div class="text-area">{{ job_description }}</div>

  <!-- Score CV Button -->
  {% if extracted_text and job_description %}
    <a href="{% url 'score_cv' document.id %}" class="button">Score My CV</a>
  {% else %}
    <a class="button disabled">Score My CV</a>
    <p style="color: red; margin-top: 10px;">⚠️ Please upload a CV and provide a Job Description first.</p>
  {% endif %}

  <p>
    <a href="{% url 'upload_document' %}" class="upload-link">Upload another CV</a>
  </p>
</body>
</html>
